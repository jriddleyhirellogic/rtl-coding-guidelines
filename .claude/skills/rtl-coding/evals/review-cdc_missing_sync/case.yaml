    module cdc_missing_sync (
      input  wire clk_a,
      input  wire clk_b,
      input  wire rst_n,
      input  wire req_a,
      output reg  ack_b
    );

      reg req_a_r;

      always @(posedge clk_a or negedge rst_n)
        if (!rst_n) req_a_r <= 1'b0;
        else        req_a_r <= req_a;

      always @(posedge clk_b or negedge rst_n)
        if (!rst_n) ack_b <= 1'b0;
        else        ack_b <= req_a_r;

    endmodule
    ```
