name: review-good_pipe_regs
description: a clean two-stage pipeline - the false-positive control
tags: [review, golden]
execution:
  prompt: |
    Review the Verilog module below against our RTL coding guidelines and
    report every violation you find. For each one give the rule ID, the
    line, what is wrong, and the fix.

    ```verilog
    `default_nettype none

    module good_pipe_regs #(
      parameter WIDTH = 8
    ) (
      input  wire             clk,
      input  wire             rst_n,
      input  wire             valid_in,
      input  wire [WIDTH-1:0] data_in,
      output reg              valid_out_r,
      output reg  [WIDTH-1:0] data_out_r
    );

      reg             valid_d1;
      reg [WIDTH-1:0] data_d1;

      always @(posedge clk or negedge rst_n) begin
        if (!rst_n) begin
          valid_d1    <= 1'b0;
          data_d1     <= {WIDTH{1'b0}};
          valid_out_r <= 1'b0;
          data_out_r  <= {WIDTH{1'b0}};
        end else begin
          valid_d1    <= valid_in;
          data_d1     <= data_in;
          valid_out_r <= valid_d1;
          data_out_r  <= data_d1;
        end
      end

    endmodule

    `default_nettype wire
    ```
