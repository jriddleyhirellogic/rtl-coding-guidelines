# Hand-written. FSMs exercise the CON (case/construct) and STR rules that the
# CDC case does not reach, especially the inferred-latch failure mode.
schema_version: "1.0"
name: generate-fsm
description: generate a small state machine and avoid the latch/default traps
tags: [generate, fsm]
execution:
  prompt: |
    Write me a SystemVerilog module for an AXI-Stream style flow-control FSM:
    states IDLE, WAIT_READY, SEND, DONE. It sees tvalid/tready and drives a
    busy output and a done pulse. Single clock, synchronous active-low reset.
  max_turns: 30
  timeout_seconds: 480
  allowed_tools: [Read, Glob, Grep, Skill]
runs: 3
graders:
  - type: tool_used
    name: skill-fired
    tool: Skill
    arm: with-only
  - type: regex
    name: is-systemverilog
    target: last_message
    pattern: "endmodule"
    match: contains
  - type: llm
    name: no-inferred-latch
    focus: last_message
    criteria: |
      Combinational blocks assign every output on every path - either through
      a default assignment before the case statement, or a complete case with
      a default branch. Any path that leaves a signal unassigned in a
      combinational block infers a latch and fails this grader.
  - type: llm
    name: one-clock-edge-per-sequential-block
    focus: last_message
    criteria: |
      Each sequential always block is sensitive to exactly one clock edge.
      Two edges of the same clock in one block, or two different clocks,
      fails. This is the only thing to judge here - ignore reset style,
      naming, and everything else.
  - type: llm
    name: reset-matches-what-was-asked
    focus: last_message
    criteria: |
      The reset is synchronous and active low, as the prompt specified: the
      sensitivity list carries the clock edge only, and the reset is tested
      inside the clocked block. An asynchronous reset fails.

      If the response notes that this deviates from a corpus default such as
      NTL_RST03 and explains that it followed the prompt instead, that is
      correct behaviour and passes - the prompt is the requirement, the rule
      is the default. Judge only the reset structure, nothing else.
  - type: llm
    name: clock-and-reset-naming
    focus: last_message
    criteria: |
      The clock signal name starts with clk and the reset name starts with
      rst, and the active-low reset carries an _n or _x suffix. Judge only
      these names, nothing else about the design.
