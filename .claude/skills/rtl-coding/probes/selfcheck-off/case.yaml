# PROBE, not part of the suite. Control arm for the self-lint experiment.
schema_version: "1.0"
name: selfcheck-off
description: arbiter generation without tool access, the current skill behaviour
tags: [probe]
execution:
  prompt: |
    Write a SystemVerilog module: a round-robin arbiter with a parameterised
    REQ_WIDTH (default 4), a one-hot grant output, a registered grant_valid,
    and a mask-based next-pointer update. Single clock, asynchronous active-low
    reset. Include the priority-select logic as a function.
  max_turns: 30
  timeout_seconds: 480
  allowed_tools: [Read, Glob, Grep, Skill]
runs: 3
graders:
  - type: llm
    name: produced-a-module
    focus: last_message
    criteria: |
      The response contains a complete SystemVerilog module definition.
